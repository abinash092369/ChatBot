version: '3.8'

services:
  postgresql:
    image: postgres:16-alpine
    container_name: chatbot_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gudu123
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: chatbot_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:gudu123@postgresql:5432/chatbot?schema=public"
      REDIS_HOST: hypergentle-point-sound-82763.db.redis.io
      REDIS_PORT: 11471
      REDIS_PASSWORD: "2T2x6skToliQhP8JH5kjrTetGNndJmI8"
      REDIS_URL: "redis://default:2T2x6skToliQhP8JH5kjrTetGNndJmI8@hypergentle-point-sound-82763.db.redis.io:11471"
      JWT_ACCESS_SECRET: "bcdf9b577c45df8608a04088853783529b09d0a97556b7dd7c8134f265767cef27c17b37e205b84e054df57be9ef00f1741d2e146c7153b4e7fad68ecc59e165"
      JWT_REFRESH_SECRET: "594c25dbe09253cf0acca1f21a709d9f53389e828c3f38632bdcbae1453cf3aeb111eb05edf3f333807cc0790aa0a877c89b749c789ef492a0ce31448cd98448"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      COOKIE_SECRET: "3d63bf02c716588853b43d83e36d48f2deb39cf49aa4d6caad02e3011d096acc709aa3939adc119f76aa440498852e8db2a3f4f027a9810091d7207a59699dde"
      GOOGLE_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "your-google-client-secret"
      GOOGLE_CALLBACK_URL: "http://localhost:5000/api/v1/auth/google/callback"
      CORS_ORIGIN: "http://localhost"
      GEMINI_API_KEY: "your-gemini-api-key"
    ports:
      - "5000:5000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: chatbot_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: chatbot_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
